              id(fan2_send).execute(6);
            } else {
              if (id(last_level_fan2) <= 0 || id(last_level_fan2) == 6) {
                id(fan2_send).execute(6);
              }
              id(fan2_send).execute(lvl);
            }
          }
          id(last_level_fan2) = lvl;
  - platform: template
