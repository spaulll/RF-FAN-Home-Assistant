esphome:
  name: rf-fan-remote
  friendly_name: Fan RF Remote (3 Fans)
  on_boot:
    priority: -100
    then:
      - remote_transmitter.digital_write: false
      - cc1101.set_idle
      - delay: 50ms
      - cc1101.begin_rx
      - lambda: 'id(boot_armed) = true;'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  max_connections: 20

ota:
  platform: esphome
  on_state_change:
    - if:
        condition:
          lambda: 'return x <= 1;'
        then:
          - lambda: 'id(ota_active) = true;'
        else:
          - if:
              condition:
                lambda: 'return x >= 100 || x == 3 || x == 4;'
              then:
                - lambda: 'id(ota_active) = false;'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

cc1101:
  cs_pin: GPIO7
  frequency: 433.92MHz
  filter_bandwidth: 540kHz

remote_transmitter:
  pin: GPIO3
  carrier_duty_percent: 100%
  rmt_symbols: 96
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  pin: GPIO10
  tolerance: 25%
  filter: 100us
  idle: 4ms
  buffer_size: 4kb
  on_raw:
    - homeassistant.event:
        event: esphome.rf_fan_remote_press
        data:
          raw: !lambda |-
            std::string s;
            for (int v : x) {
              if (!s.empty()) s += ',';
              s += std::to_string(v);
            }
            return s;

globals:
  - id: boot_writes
    type: int
    initial_value: '0'
  - id: last_level_fan1
    type: int
    initial_value: '-1'
  - id: last_level_fan2
    type: int
    initial_value: '-1'
  - id: last_level_fan3
    type: int
    initial_value: '-1'
  - id: suppress_rf
    type: bool
    initial_value: 'false'
  - id: boot_armed
    type: bool
    initial_value: 'false'
  - id: ota_active
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    id: suppress_rf_switch
    name: RF Suppress
    turn_on_action:
      - lambda: 'id(suppress_rf) = true;'
    turn_off_action:
      - lambda: 'id(suppress_rf) = false;'

