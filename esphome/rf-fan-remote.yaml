          if (id(boot_writes) < 1) {
            id(boot_writes) = 1;
            return;
          }
          if (id(ota_active) || !id(boot_armed)) return;
          int lvl = 0;
          if (state == 0.0f) {
            lvl = 0;
          } else {
            lvl = (int)round(state * 5.0f);
            if (lvl < 1) lvl = 6;
          }
          if (id(last_level_fan3) == lvl) return;
          if (!id(suppress_rf)) {
            if (lvl == 0) {
              id(fan3_send).execute(0);
            } else if (lvl == 6) {
              id(fan3_send).execute(6);
            } else {
              if (id(last_level_fan3) <= 0 || id(last_level_fan3) == 6) {
                id(fan3_send).execute(6);
              }
              id(fan3_send).execute(lvl);
            }
          }
          id(last_level_fan3) = lvl;
fan:
  - platform: speed
    name: "Fan 1"
    output: fan1_speed_out
    speed_count: 5
  - platform: speed
    name: "Fan 2"
    output: fan2_speed_out
    speed_count: 5
  - platform: speed
    name: "Fan 3"
    output: fan3_speed_out
    speed_count: 5

